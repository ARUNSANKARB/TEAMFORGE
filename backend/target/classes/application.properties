spring.application.name=TeamForge Backend
server.port=8085

# Database Configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:teamforgedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Schema Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# JWT Configuration
jwt.secret=9a2f8c4e7b1d3a5f6e8d0c2b4a6f8e1d3c5b7a9f0e2d4c6b8a1f3e5d7c9b0a2f
jwt.expiration=86400000

# App Custom Config
teamforge.recommendation.weights.skill-match=0.30
teamforge.recommendation.weights.skill-complementarity=0.20
teamforge.recommendation.weights.role-compatibility=0.15
teamforge.recommendation.weights.interest-match=0.10
teamforge.recommendation.weights.experience-compatibility=0.10
teamforge.recommendation.weights.availability-match=0.05
teamforge.recommendation.weights.preference-match=0.05
teamforge.recommendation.weights.team-balance=0.05

# Logging
logging.level.com.teamforge=INFO
logging.level.org.springframework.security=INFO
